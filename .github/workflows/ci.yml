name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in package.json; naming it here
      # too makes the action fail on a mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate the rule corpus
        run: pnpm rules:validate

      - name: Audit rule descriptions against their patterns
        run: pnpm rules:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify rules against the mushaf
        # Pins each authored rule to passages whose ruling is not in dispute, and
        # to an exact total wherever the total is known.
        run: pnpm rules:verify

      - name: Check both editions are readable
        # The failure this catches is silent. A mark the normaliser does not
        # recognise raises nothing; it stops a rule matching, and the rule then
        # reports no ruling where there is one. Both editions are checked because
        # they use different characters for the same marks.
        run: |
          pnpm edition:check editions/uthmani-hafs.json
          pnpm edition:check editions/hafs-quran-text.json

      - name: Re-measure the distance between the editions
        # reports/ is committed, so a change in the numbers shows up as a diff to
        # review rather than as something nobody noticed.
        run: |
          pnpm edition:diff editions/uthmani-hafs.json editions/hafs-quran-text.json
          git diff --exit-code reports/

      - name: The published annotations still match the corpus
        # frozen.json pins the engine, not the dataset. A corpus change that is
        # correctly re-frozen still leaves packages/annotations/uthmani-hafs.json
        # describing the old rules, and it is the file consumers actually read.
        run: |
          pnpm annotate editions/uthmani-hafs.json packages/annotations/uthmani-hafs.json
          git diff --exit-code packages/annotations/uthmani-hafs.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test the Python reader
        working-directory: python
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: .
