name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from `packageManager` in package.json; naming it here
      # too makes the action fail on a mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate the rule corpus
        run: pnpm rules:validate

      - name: Audit rule descriptions against their patterns
        run: pnpm rules:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify rules against the mushaf
        # Pins each authored rule to passages whose ruling is not in dispute, and
        # to an exact total wherever the total is known.
        run: pnpm rules:verify

      - name: Check both editions are readable
        # The failure this catches is silent. A mark the normaliser does not
        # recognise raises nothing; it stops a rule matching, and the rule then
        # reports no ruling where there is one. Both editions are checked because
        # they use different characters for the same marks.
        run: |
          pnpm edition:check editions/uthmani-hafs.json
          pnpm edition:check editions/hafs-quran-text.json

      - name: Re-measure the distance between the editions
        # reports/ is committed, so a change in the numbers shows up as a diff to
        # review rather than as something nobody noticed.
        run: |
          pnpm edition:diff editions/uthmani-hafs.json editions/hafs-quran-text.json
          git diff --exit-code reports/

      - name: The published annotations still match the corpus
        # frozen.json pins the engine, not the dataset. A corpus change that is
        # correctly re-frozen still leaves packages/annotations/uthmani-hafs.json
        # describing the old rules, and it is the file consumers actually read.
        run: |
          pnpm annotate editions/uthmani-hafs.json packages/annotations/uthmani-hafs.json
          git diff --exit-code packages/annotations/uthmani-hafs.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # This used to live in pages.yml, which rebuilt the playground on every
      # push to main and published the result. The playground is now served from
      # quran.ws, which copies the committed file rather than building it, so
      # the committed file is what has to be right.
      #
      # Two things are checked, and they are different: that a rebuild from the
      # current corpus reproduces the committed bytes, so the page cannot drift
      # from the rules it claims to demonstrate; and that the page reaches for
      # nothing external, so "works offline" stays true. A build that quietly
      # inlined a font from a CDN would pass the first and fail the second.
      - name: The committed playground matches a fresh build
        run: |
          before=$(shasum -a 256 playground/index.html | cut -d' ' -f1)
          pnpm playground:build
          after=$(shasum -a 256 playground/index.html | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "playground/index.html is stale — run: pnpm playground:build"
            echo "  committed $before"
            echo "  rebuilt   $after"
            git --no-pager diff --stat playground/index.html
            exit 1
          fi
          echo "reproduced, $before"

      - name: The playground is self-contained
        run: |
          if grep -qE '(src|href)="https?://' playground/index.html; then
            echo "The playground references something external:"
            grep -nE '(src|href)="https?://' playground/index.html
            exit 1
          fi
          echo "self-contained, $(du -h playground/index.html | cut -f1)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test the Python reader
        working-directory: python
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: .
